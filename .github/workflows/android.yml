name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # runner 自带完整 Android SDK，无需再装（android-actions/setup-android 会因请求已下架的 tools 包而失败）

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 正式签名：keystore 以 base64 存于 Secrets，构建时还原（绝不进仓库）
      - name: Restore release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
        env:
          RELEASE_KEYSTORE_PATH: app/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Publish release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "最新版"
          body: "正式签名的 release 版 APK，可直接安装；后续版本可覆盖更新。"
          files: app/build/outputs/apk/release/app-release.apk
