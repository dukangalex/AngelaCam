name: angelacam-smoke

# AngelaCam 全自动冒烟测试（无需人工介入）：
# Build APK 构建成功后自动触发 → 模拟器安装 APK → 启动截图 → 检查进程存活 →
# 验证"打开方式" intent-filter（VIEW 图片/视频能解析到 AngelaCam）→ 上传截图。

"on":
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: smoke-api-${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [34]
    steps:
      - name: Checkout source for UI smoke
        uses: actions/checkout@v4
      - name: Download APK from dev-latest (authenticated)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download dev-latest --repo dukangalex/AngelaCam --pattern app-release.apk --output app-release.apk
          python3 -c "import hashlib,os,zipfile; p='app-release.apk'; z=zipfile.ZipFile(p); assert os.path.getsize(p)>1000000; assert 'AndroidManifest.xml' in z.namelist(); assert z.testzip() is None; print('APK_DOWNLOAD_OK bytes='+str(os.path.getsize(p))+' sha256='+hashlib.sha256(open(p,'rb').read()).hexdigest())"

      - name: Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_4
          script: |
            python3 .github/scripts/angelacam-smoke-ui.py app-release.apk
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angelacam-smoke-screenshot-api-${{ matrix.api-level }}
          path: |
            smoke-launch.png
            smoke-settings.png
            smoke-home.xml
            smoke-quick-controls.xml
            settings-ui.xml
            gallery-permission-disclosure.xml
            smoke-diagnostics/**
          if-no-files-found: warn
